<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Candy Ads</title>
<link rel="stylesheet" href="/assets/lead.css?v=2">
<script>
// GitHub Pages no tiene rewrites: /lead/<slug> cae aquí y se reenvía al formulario.
(function () {
  var m = location.pathname.match(/^\/lead\/([a-z0-9][a-z0-9-]{0,60})\/?$/i);
  if (m) location.replace('/lead.html?s=' + encodeURIComponent(m[1].toLowerCase()));
})();
</script>
<link rel="icon" type="image/png" href="/assets/candyads-icono.png">
</head>
<body>
<header class="topbar logo-top"><a class="logo" href="/"><img src="/assets/candyads-icono.png" alt="Candy Ads" width="56" height="56"><img src="/assets/candyads-logotipo.jpg" alt="" width="94" height="40"></a></header>
<main class="wrap">
  <div class="card center">
    <p class="eyebrow">Error 404</p>
    <h1>Página no encontrada</h1>
    <p class="lead">La página que buscas no existe o ha cambiado de sitio.</p>
    <a href="/">Ir a candyads.es</a>
  </div>
</main>
</body>
</html>
